name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  # The suite and linked native runner must come from this same revision.
  # ebf28ea is the published 3.4 extension (vgi v2.0); its suite expects PROTOCOL_VERSIONS_V1
  # refusals (protocol_version/version_mismatch.test).
  VGI_REF: d780e7485ae392644b86fd6935b75aaad992447a  # ebf28ea (published 3.4 extension) + merge.test for Haybarn 2.0.1-rc3
  VGI_NATIVE_RUNNER_BRANCH: protocol-3.4
  # vgi's SDK-neutral Orchard hosted-mode harness (test/hosted/), at or after fce5798.
  VGI_HOSTED_REF: fce57984a7e8ea35f9dcd4a034b5ed37c85ca5c5

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: make format_check

  # vgi-rpc's shared hosted-protocols group against the fixture worker on stdio, unix and HTTP
  # (+ vgi_rpc.Identity.v2): conformance.Secondary.v1 hosted through Worker.HostedProtocols, the
  # error model through this SDK's server, and the Identity opt-in. The reference is installed from
  # a checkout of vgi-rpc-python (unpinned main, by design), as vgi-rpc-csharp's conformance job does.
  hosted-protocols:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: _conformance/vgi-rpc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "./_conformance/vgi-rpc[http,conformance]" pytest pytest-timeout
      - run: dotnet build -c Release
      - run: ci/run-hosted-protocols.sh

  # Orchard hosted mode (VGI_ORCHARD_HOSTED=1): vgi's SDK-neutral black-box harness, the
  # definition of done for hosted mode, against the example worker over HTTP, with stdio, --unix
  # and --iroh-raw-upstream as must-refuse commands.
  orchard-hosted:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the pinned hosted-mode harness
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_HOSTED_REF }}
          path: vgi-hosted
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: astral-sh/setup-uv@v6
      - run: dotnet build -c Release
      - name: Run the hosted-mode conformance harness
        run: ci/run-orchard-hosted.sh --log-dir "$RUNNER_TEMP/hosted-logs"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-hosted
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: orchard-hosted-logs
          path: ${{ runner.temp }}/hosted-logs

  # Run the canonical suite with a matching VGI-linked native runner. BOTH transports, because they are two
  # separate dispatch implementations that have diverged in production: a launcher-only lane
  # reported 333/334 green while 81 files were red over HTTP.
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        transport: [launch, http, s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build -c Release

      - name: AWS CLI (the s3 lane creates its bucket with it)
        if: matrix.transport == 's3'
        run: |
          command -v aws || {
            curl -sSfL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o "$RUNNER_TEMP/awscli.zip"
            unzip -q "$RUNNER_TEMP/awscli.zip" -d "$RUNNER_TEMP" && sudo "$RUNNER_TEMP/aws/install"
          }
          aws --version

      - name: Checkout pinned vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch matching native integration runner
        run: >-
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py"
          --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite (${{ matrix.transport }})
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          TRANSPORT: ${{ matrix.transport }}

  # The extension's blob-vendor files (test/sql/external_storage/, the protocol 3.4
  # argument-reference ones included) against the example worker over HTTP, with vgi-rpc's fake
  # blob vendor (started by the suite's test/start_fake_blob_vendor.sh through uvx).
  vendor-lane:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # scripts/run_tests.py needs 3.12+
      - run: dotnet build -c Release
      - name: Checkout pinned vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch matching native integration runner
        run: >-
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py"
          --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}
      - name: Run the vendor lane
        run: ci/run-vendor-lane.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
      # Orchard hosted mode with the vendor (OrchardHostedVendorTests): grants bound to the Pass
      # principal, results externalized. It skips without the fake vendor, so give it one.
      - name: Hosted mode against the fake vendor
        run: |
          uv venv -q "$RUNNER_TEMP/fake-vendor"
          uv pip install -q -p "$RUNNER_TEMP/fake-vendor" \
            "vgi-rpc[http,external]==0.57.0"
          VGI_RPC_FAKE_VENDOR_BIN="$RUNNER_TEMP/fake-vendor/bin/vgi-rpc-fake-vendor" \
            dotnet test test/QueryFarm.Vgi.Tests -c Release --no-build --filter "FullyQualifiedName~OrchardHostedVendorTests"
