name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      # Local dev's `make format_check` scopes to OWN_PROJECTS (the Makefile's own list) to
      # skip vgi-rpc-csharp's vendored third_party/ when the sibling checkout is present as a
      # ProjectReference. CI never has that checkout (QueryFarm.Vgi falls back to the published
      # QueryFarm.VgiRpc package here), so vgi-csharp.slnx only ever contains this repo's own
      # projects and needs no such exclusion.
      - run: dotnet format vgi-csharp.slnx --verify-no-changes

  # vgi-rpc's shared hosted-protocols group against the fixture worker on stdio, unix and HTTP
  # (+ vgi_rpc.Identity.v1): conformance.Secondary.v1 hosted through Worker.HostedProtocols, the
  # error model through this SDK's server, and the Identity opt-in. The reference is installed from
  # a checkout of vgi-rpc-python (unpinned main, by design), as vgi-rpc-csharp's conformance job does.
  hosted-protocols:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: _conformance/vgi-rpc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "./_conformance/vgi-rpc[http,conformance]" pytest pytest-timeout
      - run: dotnet build -c Release
      - run: ci/run-hosted-protocols.sh

  # See ci/README.md: runs the canonical suite against a prebuilt haybarn-unittest + the signed
  # community vgi extension, no C++ build from source. BOTH transports, because they are two
  # separate dispatch implementations that have diverged in production: a launcher-only lane
  # reported 333/334 green while 81 files were red over HTTP.
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        transport: [launch, http]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build -c Release

      - name: Checkout pinned vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: main
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest haybarn release
        run: |
          REL=$(gh release view --repo Query-farm-haybarn/haybarn --json tagName --jq .tagName)
          echo "HAYBARN_RELEASE=$REL" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download haybarn-unittest
        run: |
          gh release download "$HAYBARN_RELEASE" \
            --repo Query-farm-haybarn/haybarn \
            --pattern 'haybarn_unittest-linux-amd64.zip' \
            --output /tmp/haybarn-unittest.zip --clobber
          unzip -o -q /tmp/haybarn-unittest.zip -d /tmp/haybarn-unittest
          UNITTEST=$(find /tmp/haybarn-unittest -name 'haybarn-unittest' -type f | head -1)
          chmod +x "$UNITTEST"
          echo "HAYBARN_UNITTEST=$UNITTEST" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite (${{ matrix.transport }})
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          TRANSPORT: ${{ matrix.transport }}
