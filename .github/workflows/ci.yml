name: CI

on:
  push:
    branches: [main]
  pull_request:

# Resolve the same NuGet RPC dependencies as published SDK consumers.
permissions:
  contents: read
  actions: read

env:
  # The suite and linked native runner must come from this same revision.
  VGI_REF: fc3e08f7e7fd800165a0edc00313de46fed15329

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet restore
      - run: make format_check

  # vgi-rpc's shared hosted-protocols group against the fixture worker on stdio, unix and HTTP
  # (+ vgi_rpc.Identity.v2): conformance.Secondary.v1 hosted through Worker.HostedProtocols, the
  # error model through this SDK's server, and the Identity opt-in. The reference is installed from
  # a checkout of vgi-rpc-python (unpinned main, by design), as vgi-rpc-csharp's conformance job does.
  hosted-protocols:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi-rpc-python
          path: _conformance/vgi-rpc
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "./_conformance/vgi-rpc[http,conformance]" pytest pytest-timeout
      - run: dotnet build -c Release
      - run: ci/run-hosted-protocols.sh

  # Run the canonical suite with a matching VGI-linked native runner. BOTH transports, because they are two
  # separate dispatch implementations that have diverged in production: a launcher-only lane
  # reported 333/334 green while 81 files were red over HTTP.
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        transport: [launch, http]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - run: dotnet build -c Release

      - name: Checkout pinned vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch matching native integration runner
        run: >-
          python3 "$VGI_SRC/scripts/ci_fetch_native_runner.py"
          --source "$VGI_SRC" --output "$RUNNER_TEMP/vgi-native"
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite (${{ matrix.transport }})
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
          TRANSPORT: ${{ matrix.transport }}
