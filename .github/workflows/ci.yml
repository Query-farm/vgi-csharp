name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      # Local dev's `make format_check` scopes to OWN_PROJECTS (the Makefile's own list) to
      # skip vgi-rpc-csharp's vendored third_party/ when the sibling checkout is present as a
      # ProjectReference. CI never has that checkout (QueryFarm.Vgi falls back to the published
      # QueryFarm.VgiRpc package here), so vgi-csharp.slnx only ever contains this repo's own
      # projects and needs no such exclusion.
      - run: dotnet format vgi-csharp.slnx --verify-no-changes

  # See ci/README.md: a single (subprocess) lane against a prebuilt haybarn-unittest + the
  # signed community vgi extension, no C++ build from source. First-pass, not yet run against
  # a real haybarn-unittest binary — see that doc's "Scope of this first version" section.
  integration:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release

      - name: Checkout pinned vgi test suite
        uses: actions/checkout@v4
        with:
          repository: Query-farm/vgi
          ref: main
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve latest haybarn release
        run: |
          REL=$(gh release view --repo Query-farm-haybarn/haybarn --json tagName --jq .tagName)
          echo "HAYBARN_RELEASE=$REL" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download haybarn-unittest
        run: |
          gh release download "$HAYBARN_RELEASE" \
            --repo Query-farm-haybarn/haybarn \
            --pattern 'haybarn_unittest-linux-amd64.zip' \
            --output /tmp/haybarn-unittest.zip --clobber
          unzip -o -q /tmp/haybarn-unittest.zip -d /tmp/haybarn-unittest
          UNITTEST=$(find /tmp/haybarn-unittest -name 'haybarn-unittest' -type f | head -1)
          chmod +x "$UNITTEST"
          echo "HAYBARN_UNITTEST=$UNITTEST" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run integration suite
        run: ci/run-integration.sh
        env:
          VGI_SRC: ${{ github.workspace }}/vgi-upstream
